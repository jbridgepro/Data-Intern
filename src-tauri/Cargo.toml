[package]
name = "projectfile-pro"
version = "1.0.5"
description = "Professional file management and organization tool"
authors = ["ProjectFile Pro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projectfile_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tiberius = { version = "0.12", features = ["sql-browser-tokio", "chrono", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
base64 = "0.22"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "postgres", "sqlite", "macros"] }
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
walkdir = "2"
regex = "1"
ignore = "0.4"
rayon = "1.8"
