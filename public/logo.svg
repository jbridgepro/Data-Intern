  />

  <!-- Folded corner -->
  <path
    d="M300 150
       V190
       H340
       Z"
    fill="#e5e7eb"
  />

  <!-- Star -->
  <path
    d="M256 215
       L266 245
       L296 256
       L266 266
       L256 296
       L246 266
       L216 256
       L246 245
       Z"
