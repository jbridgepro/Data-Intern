# File: .github/workflows/release.yml
# Build and attach Tauri installers to GitHub Releases on version tags (v*) or workflow_dispatch.
# macOS: signing and notarization when ENABLE_MACOS_SIGNING and Apple secrets are set.
# Releases are created as drafts with auto-generated changelogs for review before publishing.

name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v1.0.5) to build and attach assets for"
        required: true
        default: "v1.0.5"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "false"

jobs:
  # ── Fast-fail validation ────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  # ── Generate changelog from git history ─────────────────────────
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"

          # Find the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            HEADER="Initial release"
          else
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Changes since ${PREV_TAG}"
          fi

          # Build the changelog body
          {
            echo "body<<CHANGELOG_EOF"
            echo "## ProjectFile Pro ${TAG}"
            echo ""
            echo "### ${HEADER}"
            echo ""
            git log --pretty=format:"- %s (%h)" ${RANGE} -- . ':!*.md' 2>/dev/null | head -50 || echo "- Release ${TAG}"
            echo ""
            echo ""
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| **Windows** | \`.exe\` (NSIS installer) |"
            echo "| **macOS** | \`.dmg\` (drag-to-install) |"
            echo "| **Linux** | \`.deb\`, \`.rpm\`, \`.AppImage\` |"
            echo ""
            echo "---"
            echo "Built from ${TAG}."
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

  # ── Multi-platform build & release ──────────────────────────────
  build-and-release:
    name: Build and attach (${{ matrix.platform }})
    needs: [validate, changelog]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          enable-macos-signing: ${{ vars.ENABLE_MACOS_SIGNING || 'false' }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build and upload Tauri bundles (signed macOS)
        if: matrix.platform != 'macos' || (vars.ENABLE_MACOS_SIGNING == 'true' || vars.ENABLE_MACOS_SIGNING == '1')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-identity.outputs.signing_identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "."
          args: ${{ matrix.platform == 'windows' && '--bundles nsis' || (matrix.platform == 'linux' && '--bundles deb,rpm,appimage' || '') }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: ProjectFile Pro ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          includeDebug: false

      - name: Build and upload Tauri bundles (unsigned macOS)
        if: matrix.platform == 'macos' && !(vars.ENABLE_MACOS_SIGNING == 'true' || vars.ENABLE_MACOS_SIGNING == '1')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "."
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: ProjectFile Pro ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ${{ needs.changelog.outputs.body }}

            > **Note:** macOS build is unsigned. You may need to right-click → Open on first launch.
          releaseDraft: true
          includeDebug: false
